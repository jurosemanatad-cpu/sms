databases:
  - name: sms-db
    databaseName: sms
    user: sms_user
    plan: free

services:
  - type: web
    name: sms-api
    env: node
    plan: free
    rootDir: api
    buildCommand: npm install --include=dev && npm run prisma:generate && npx prisma db push --accept-data-loss && npm run build
    startCommand: npm run start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: sms-db
          property: connectionString
      - key: JWT_SECRET
        value: your-production-jwt-secret-change-this
      - key: CORS_ORIGINS
        value: https://sms-web-gn32.onrender.com

  - type: web
    name: sms-web
    env: static
    rootDir: web
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://sms-api-3y9r.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html