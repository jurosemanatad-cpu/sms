databases:
  - name: sms-db
    databaseName: sms
    user: sms_user
    plan: free

services:
  - type: web
    name: sms-api
    env: node
    plan: free
    rootDir: api
    buildCommand: npm install && npm run build && npm run prisma:generate && npm run prisma:deploy
    startCommand: npm run start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        fromDatabase:
          name: sms-db
          property: connectionString
      - key: CORS_ORIGINS
        value: https://sms-web.onrender.com

  - type: web
    name: sms-web
    env: static
    rootDir: web
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    pullRequestPreviewsEnabled: true
    envVars:
      - key: VITE_API_URL
        value: https://sms-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
